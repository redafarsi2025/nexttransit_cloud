name: NextTransit Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Build, Typecheck & Decision Engine Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (fails only on NEW problems vs .eslint-baseline.json, see audit/07_ROADMAP_MVP.md décision 7)
        run: node scripts/ci/check-eslint-baseline.cjs

      - name: Run Decision Engine & Service Unit Tests (Vitest)
        run: npm test

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack (Postgres via Docker)
        run: supabase start

      - name: RLS & Multi-Tenant Isolation Tests (executed for real, not just checked for existence)
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          for f in supabase/tests/rls-isolation-test.sql supabase/tests/rls-role-based-policies-test.sql supabase/tests/verify-tenant-foreign-keys.sql; do
            if [ -f "$f" ]; then
              echo "=== Running $f ==="
              psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f"
            else
              echo "SKIP: $f not found"
            fi
          done

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop

      - name: Build Application (Vite & Express Server CJS Bundle)
        run: npm run build
        env:
          NODE_ENV: production

